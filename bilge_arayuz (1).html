<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BILGE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;transition:background .8s;}
  body.light{background:#FBFCFE;}
  body.dark{background:#0B1020;}
  canvas{position:absolute;inset:0;width:100%;height:100%;}
  .corner{position:absolute;top:0;z-index:2;padding:30px 38px 0;transition:opacity .8s;}
  .tl{left:0;text-align:left;} .tr{right:0;text-align:right;}
  #clk{font-size:60px;font-weight:500;line-height:1;letter-spacing:2px;}
  #sec{font-size:20px;margin-top:8px;letter-spacing:2px;}
  #dW{font-size:24px;font-weight:500;} #dD{font-size:24px;margin-top:6px;}
  #net{font-size:14px;margin-top:14px;display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  #netdot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  #foot{position:absolute;bottom:52px;left:0;right:0;text-align:center;z-index:2;transition:opacity .6s;}
  #name{font-size:40px;font-weight:500;letter-spacing:14px;}
  #st{font-size:20px;margin-top:12px;letter-spacing:5px;transition:color .5s;}
  #muzikkart{position:absolute;left:26px;bottom:26px;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;max-width:340px;opacity:0;transition:opacity .5s,background .8s;}
  body.light #muzikkart{background:rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(60,80,120,.14);}
  body.dark #muzikkart{background:rgba(22,30,54,.92);box-shadow:0 8px 24px rgba(0,0,0,.4);}
  #notaikon{width:34px;height:34px;flex-shrink:0;}
  #muzikad{font-size:16px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  body.light #muzikad{color:#2A2F3A;} body.dark #muzikad{color:#E6ECF7;}
  #panel{position:absolute;right:26px;top:170px;bottom:210px;width:360px;max-width:40%;z-index:6;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .45s,transform .45s,background .8s;}
  #panel.acik{opacity:1;transform:translateX(0);pointer-events:auto;}
  body.light #panel{background:rgba(255,255,255,.95);box-shadow:0 12px 40px rgba(60,80,120,.18);}
  body.dark #panel{background:rgba(20,28,50,.95);box-shadow:0 12px 40px rgba(0,0,0,.5);}
  #panelbas{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;flex-shrink:0;}
  #paneltitle{font-size:19px;font-weight:600;letter-spacing:.3px;line-height:1.25;}
  body.light #paneltitle{color:#D6453F;} body.dark #paneltitle{color:#FF6B63;}
  #panelkapat{border:none;background:none;font-size:26px;line-height:1;cursor:pointer;padding:0 4px;opacity:.5;transition:opacity .2s;}
  body.light #panelkapat{color:#2A2F3A;} body.dark #panelkapat{color:#E6ECF7;}
  #panelkapat:hover{opacity:1;}
  #panelicerik{padding:0 18px 18px;overflow-y:auto;font-size:15px;line-height:1.5;}
  body.light #panelicerik{color:#3A4150;} body.dark #panelicerik{color:#C9D3E4;}
  #panelicerik .madde{display:flex;gap:8px;margin:7px 0;}
  #panelicerik .madde:before{content:"";flex-shrink:0;width:7px;height:7px;border-radius:50%;margin-top:8px;}
  body.light #panelicerik .madde:before{background:#378ADD;} body.dark #panelicerik .madde:before{background:#6FB4FF;}
  #panelicerik .satir{margin:7px 0;}
  #panelicerik::-webkit-scrollbar{width:6px;} #panelicerik::-webkit-scrollbar-thumb{background:rgba(140,150,170,.4);border-radius:3px;}
  body.light #clk{color:#D6453F;} body.light #sec{color:#378ADD;} body.light #dW{color:#378ADD;} body.light #dD{color:#7C8794;} body.light #name{color:#D6453F;} body.light #st{color:#9AA3AF;} body.light #net{color:#9AA3AF;} body.light #muzikad{color:#378ADD;}
  body.dark #clk{color:#FF6B63;} body.dark #sec{color:#6FB4FF;} body.dark #dW{color:#6FB4FF;} body.dark #dD{color:#9AA7BD;} body.dark #name{color:#FF6B63;} body.dark #st{color:#7E8AA3;} body.dark #net{color:#7E8AA3;} body.dark #muzikad{color:#6FB4FF;}
  /* sag alt sohbet */
  #sohbet{position:absolute;right:26px;bottom:26px;z-index:5;width:300px;border-radius:16px;padding:12px;transition:background .8s;}
  body.light #sohbet{background:rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(60,80,120,.14);}
  body.dark #sohbet{background:rgba(22,30,54,.92);box-shadow:0 8px 28px rgba(0,0,0,.4);}
  #giris{width:100%;height:66px;resize:none;border:none;outline:none;border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;line-height:1.3;cursor:text;-webkit-user-select:text;user-select:text;}
  body.light #giris{background:#F1F4F8;color:#2A2F3A;} body.dark #giris{background:#0F1730;color:#E6ECF7;}
  #giris::placeholder{color:#9AA3AF;}
  #gonder{margin-top:8px;width:100%;height:38px;border:none;border-radius:10px;font-size:15px;font-weight:600;letter-spacing:1px;cursor:pointer;color:#fff;transition:filter .2s;}
  body.light #gonder{background:#378ADD;} body.dark #gonder{background:#3A6EA5;}
  #gonder:active{filter:brightness(1.15);}
  .suzenmesaj{position:absolute;right:40px;bottom:120px;z-index:5;max-width:280px;padding:11px 16px;border-radius:16px;font-size:15px;line-height:1.3;text-align:left;opacity:1;transform:translateY(0);transition:transform 1.5s cubic-bezier(.2,.7,.3,1),opacity 1.5s ease;pointer-events:none;}
  body.light .suzenmesaj{background:#378ADD;color:#fff;box-shadow:0 6px 20px rgba(55,138,221,.3);}
  body.dark .suzenmesaj{background:#3A6EA5;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .suzenmesaj.git{transform:translateY(-320px) scale(.85);opacity:0;}
  #intro{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s;}
  body.light #intro{background:#FBFCFE;} body.dark #intro{background:#0B1020;}
  #introName{font-size:70px;font-weight:500;letter-spacing:24px;opacity:0;transform:translateY(20px);animation:up 1.2s .3s forwards;}
  body.light #introName{color:#D6453F;} body.dark #introName{color:#FF6B63;}
  #introSub{font-size:20px;letter-spacing:8px;margin-top:20px;opacity:0;animation:fade 1.2s 1.1s forwards;color:#9AA3AF;}
  @keyframes up{to{opacity:1;transform:translateY(0);}}
  @keyframes fade{to{opacity:1;}}
</style>
</head>
<body class="light">
<canvas id="cv"></canvas>
<div class="corner tl"><div id="clk">--:--</div><div id="sec">.</div></div>
<div class="corner tr"><div id="dW">-</div><div id="dD">-</div><div id="net"><span id="netdot"></span><span id="nettxt">bagli</span></div></div>
<div id="foot"><div id="name">BILGE</div><div id="st">HAZIR</div></div>
<div id="panel"><div id="panelbas"><span id="paneltitle"></span><button id="panelkapat">&times;</button></div><div id="panelicerik"></div></div>
<div id="muzikkart"><img id="notaikon" alt=""><span id="muzikad"></span></div>
<div id="sohbet"><textarea id="giris" placeholder="Bana bir sey yaz..."></textarea><button id="gonder">GONDER</button></div>
<div id="intro"><div id="introName">BILGE</div><div id="introSub">merhaba</div></div>
<script>
var TR_M=["Ocak","Subat","Mart","Nisan","Mayis","Haziran","Temmuz","Agustos","Eylul","Ekim","Kasim","Aralik"];
var TR_D=["Pazar","Pazartesi","Sali","Carsamba","Persembe","Cuma","Cumartesi"];
function pad(n){return (n<10?"0":"")+n;}
function tick(){var d=new Date();clk.textContent=pad(d.getHours())+":"+pad(d.getMinutes());sec.textContent=pad(d.getSeconds());dW.textContent=TR_D[d.getDay()];dD.textContent=d.getDate()+" "+TR_M[d.getMonth()]+" "+d.getFullYear();}
setInterval(tick,1000);tick();
function netCheck(){var ok=navigator.onLine;document.getElementById("netdot").style.background=ok?"#2FA96B":"#D6352B";document.getElementById("nettxt").textContent=ok?"bagli":"baglanti yok";}
setInterval(netCheck,4000);netCheck();
setTimeout(function(){var i=document.getElementById("intro");i.style.opacity=0;setTimeout(function(){i.style.display="none";},1000);},2600);

function suzul(m){
  var d=document.createElement("div");d.className="suzenmesaj";d.textContent=m;
  document.body.appendChild(d);
  requestAnimationFrame(function(){d.classList.add("git");});
  setTimeout(function(){d.remove();},1700);
}
function mesajGonder(){
  var g=document.getElementById("giris");var m=g.value.trim();if(!m)return;
  g.value="";
  suzul(m);
  fetch("http://127.0.0.1:8137",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mesaj:m})}).catch(function(e){});
}
document.getElementById("gonder").addEventListener("click",mesajGonder);
document.getElementById("giris").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();mesajGonder();}});

var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),dpr,W,H,cx,cy,SC;
function rz(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;SC=Math.min(W,H)/300;}
addEventListener("resize",rz);rz();

var RENK={mutlu:"#2FA96B",sakin:"#378ADD",merakli:"#8A5CD1",sasirmis:"#E0912B",uzgun:"#3A6EA5",kizgin:"#D6352B",sikilmis:"#7C8794"};

var DUR="hazir",DUY="sakin",MUZIK=false,MUZAD="",SAHNE="yok",TEMA="light";
function setTema(t){if(t!=="light"&&t!=="dark")return;if(TEMA===t)return;TEMA=t;document.body.className=t;}
var _panelId="";
function panelGoster(p){
  var el=document.getElementById("panel");
  if(!p||!p.icerik){el.classList.remove("acik");_panelId="";return;}
  var yeniId=(p.baslik||"")+"|"+p.icerik.length;
  if(yeniId===_panelId){return;}
  _panelId=yeniId;
  document.getElementById("paneltitle").textContent=p.baslik||"";
  var ic=document.getElementById("panelicerik");ic.innerHTML="";
  var satirlar=p.icerik.split("\n");
  for(var i=0;i<satirlar.length;i++){
    var st=satirlar[i].trim();if(!st)continue;
    var d=document.createElement("div");
    if(/^[\-\*\u2022]\s+/.test(st)){d.className="madde";d.appendChild(document.createTextNode(st.replace(/^[\-\*\u2022]\s+/,"")));}
    else{d.className="satir";d.textContent=st;}
    ic.appendChild(d);
  }
  ic.scrollTop=0;el.classList.add("acik");
}
function panelKapat(){document.getElementById("panel").classList.remove("acik");_panelId="kapatildi";
  fetch("http://127.0.0.1:8137",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({panel_kapat:true})}).catch(function(e){});}
document.getElementById("panelkapat").addEventListener("click",panelKapat);
function poll(){fetch("http://127.0.0.1:8137").then(function(r){return r.json();}).then(function(j){
  DUR=j.d;DUY=j.duygu||"sakin";MUZIK=!!j.muzik;MUZAD=j.muzik_ad||"";SAHNE=(j.sahne===undefined||j.sahne===null)?SAHNE:j.sahne;
  if(j.tema)setTema(j.tema);
  panelGoster(j.panel);
  var lbl=MUZIK?"MUZIK":(DUR==="dusunuyor"?"DUSUNUYOR":DUR==="konusuyor"?"KONUSUYOR":"HAZIR");
  var st=document.getElementById("st");if(st.textContent!==lbl)st.textContent=lbl;
  var kart=document.getElementById("muzikkart"),ma=document.getElementById("muzikad"),ni=document.getElementById("notaikon");
  if(MUZIK&&MUZAD){ma.textContent=MUZAD;if(!ni.src){ni.onerror=function(){ni.onerror=null;ni.src="https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@master/color/svg/1F3B5.svg";};ni.src="https://openmoji.org/data/color/svg/1F3B5.svg";}kart.style.opacity=1;}else{kart.style.opacity=0;}
}).catch(function(e){});}
setInterval(poll,300);

// ---------- HAVA / SAHNE efektleri (tam ekran, guclu) ----------
var parcalar=[],SAHNE_AKTIF="yok";
function parcaKur(tip){parcalar=[];var n=(tip==="yagmurlu")?220:(tip==="karli")?140:0;
  for(var i=0;i<n;i++)parcalar.push({x:Math.random()*W,y:Math.random()*H,z:0.4+Math.random()*1.0,r:Math.random()*6.28});}
function sahneKontrol(){if(SAHNE!==SAHNE_AKTIF){SAHNE_AKTIF=SAHNE;parcaKur(SAHNE);}}
function havaCiz(s,sa){
  sahneKontrol();
  ctx.save();ctx.globalAlpha=sa;
  if(SAHNE==="gunesli"){
    var g=ctx.createRadialGradient(W-160*s,150*s,10,W-160*s,150*s,Math.max(W,H)*0.9);
    g.addColorStop(0,"rgba(255,210,110,0.40)");g.addColorStop(0.4,"rgba(255,180,80,0.14)");g.addColorStop(1,"rgba(255,180,80,0)");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W-160*s,150*s);ctx.rotate(t*0.25);
    ctx.strokeStyle="rgba(255,190,70,0.55)";ctx.lineWidth=4*s;
    for(var i=0;i<16;i++){var a=i*Math.PI/8;ctx.beginPath();ctx.moveTo(Math.cos(a)*55*s,Math.sin(a)*55*s);ctx.lineTo(Math.cos(a)*(78+8*Math.sin(t*3+i))*s,Math.sin(a)*(78+8*Math.sin(t*3+i))*s);ctx.stroke();}
    ctx.restore();
    ctx.fillStyle="rgba(255,205,80,0.9)";ctx.beginPath();ctx.arc(W-160*s,150*s,42*s,0,7);ctx.fill();
  } else if(SAHNE==="yagmurlu"){
    ctx.strokeStyle="rgba(120,170,230,0.65)";ctx.lineWidth=2;
    for(var i=0;i<parcalar.length;i++){var p=parcalar[i];p.y+=18*p.z;p.x-=3*p.z;if(p.y>H){p.y=-20;p.x=Math.random()*W;}
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-4*p.z,p.y+18*p.z);ctx.stroke();}
  } else if(SAHNE==="karli"){
    ctx.fillStyle="rgba(235,244,255,0.92)";
    for(var i=0;i<parcalar.length;i++){var p=parcalar[i];p.y+=1.6*p.z;p.x+=Math.sin(t+p.r)*0.7;if(p.y>H){p.y=-10;p.x=Math.random()*W;}
      ctx.beginPath();ctx.arc(p.x,p.y,2.4*p.z,0,7);ctx.fill();}
  } else if(SAHNE==="bulutlu"){
    ctx.fillStyle="rgba(180,190,205,0.30)";
    for(var i=0;i<5;i++){var bx=((t*14*(0.5+i*0.18)+i*340)%(W+500))-250,by=80*s+i*66*s;
      ctx.beginPath();ctx.ellipse(bx,by,100*s,36*s,0,0,7);ctx.ellipse(bx+66*s,by+12*s,66*s,28*s,0,0,7);ctx.ellipse(bx-56*s,by+10*s,56*s,24*s,0,0,7);ctx.fill();}
  }
  ctx.restore();
}

// ---------- MUZIK: DJ yatay ekolayzer ----------
var djbar=[];for(var i=0;i<48;i++)djbar.push({f:Math.random()*6.28,h:0});
function djCiz(mix){
  var n=djbar.length,gap=6*SC,bw=Math.min(16*SC,(W*0.72)/n-gap),tot=n*(bw+gap)-gap,x0=cx-tot/2,taban=cy;
  for(var i=0;i<n;i++){var b=djbar[i];
    var hedef=(0.18+0.82*Math.abs(Math.sin(t*5+b.f)*0.55+Math.sin(t*8.3-b.f*1.4)*0.3+Math.sin(t*3.1+i)*0.15))*150*SC;
    b.h+=(hedef-b.h)*0.30;var x=x0+i*(bw+gap),h=b.h*mix,t01=i/n;
    var r=Math.round(70+150*Math.abs(Math.sin(t01*3.14))),g=Math.round(120+90*t01),bl=Math.round(240-120*t01);
    var grad=ctx.createLinearGradient(0,taban-h,0,taban+h);
    grad.addColorStop(0,"rgba("+r+","+g+","+bl+","+(0.95*mix)+")");
    grad.addColorStop(0.5,"rgba("+r+","+g+","+bl+","+(0.55*mix)+")");
    grad.addColorStop(1,"rgba("+r+","+g+","+bl+","+(0.95*mix)+")");
    ctx.fillStyle=grad;
    roundRect(x,taban-h,bw,h,bw/2);ctx.fill();
    roundRect(x,taban,bw,h,bw/2);ctx.fill();
  }
  // orta yatay parlak cizgi (DJ ekseni)
  ctx.strokeStyle="rgba(150,120,240,"+(0.5*mix)+")";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x0-20*SC,taban);ctx.lineTo(x0+tot+20*SC,taban);ctx.stroke();
}
function roundRect(x,y,w,h,r){if(h<0){y+=h;h=-h;}r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- MERKEZ: duygu renkli spektrum + radar halka (emoji DOM ustte) ----------
var pulse=[],lp=0;
function merkezCiz(s,col,gen){
  var ringCol=(TEMA==="dark")?"#26304A":"#DDE3EC",tickCol=(TEMA==="dark")?"#33405E":"#C5CEDA";
  ctx.globalAlpha=gen;
  ctx.strokeStyle=ringCol;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,150*s,0,7);ctx.stroke();
  ctx.strokeStyle=tickCol;
  for(var i=0;i<72;i++){var a=t*.12+i*Math.PI/36,r1=150*s,r2=(i%6===0?160:156)*s;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);ctx.stroke();}
  var amp=(DUR==="konusuyor")?1:(DUR==="dusunuyor")?0.6:0.26;
  var CN=72,ric=96*s;ctx.lineCap="round";
  for(var q=0;q<CN;q++){var qa=q/CN*Math.PI*2;
    var sd=Math.sin(qa*7+t*3.1)*0.5+Math.sin(qa*13-t*2.3)*0.3+Math.sin(qa*3+t*1.5)*0.2;sd=0.5+0.5*sd;
    var blen=(5+sd*38*amp)*s;
    var x1=cx+Math.cos(qa)*ric,y1=cy+Math.sin(qa)*ric,x2=cx+Math.cos(qa)*(ric+blen),y2=cy+Math.sin(qa)*(ric+blen);
    ctx.globalAlpha=gen*(0.30+0.6*sd);ctx.strokeStyle=col;ctx.lineWidth=2.6;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  ctx.lineCap="butt";
  var nb=138*s+Math.sin(t*2)*4*s;
  ctx.strokeStyle=col;ctx.globalAlpha=gen*0.5;ctx.lineWidth=2.4;
  ctx.beginPath();ctx.arc(cx,cy,nb,0,7);ctx.stroke();
  var hiz=(DUR==="konusuyor")?2.2:(DUR==="dusunuyor")?1.6:1;
  if(t-lp>1.2/hiz){pulse.push({r:138*s,a:.28});lp=t;}
  for(var p=pulse.length-1;p>=0;p--){var pl=pulse[p];pl.r+=1.1*hiz*s;pl.a*=.97;if(pl.a<.015){pulse.splice(p,1);continue;}ctx.globalAlpha=gen*pl.a;ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(cx,cy,pl.r,0,7);ctx.stroke();}
  ctx.globalAlpha=gen*0.12;ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,86*s,0,7);ctx.fill();
  var par=(DUR==="konusuyor")?0.95:(DUR==="dusunuyor")?0.8:0.7;
  var cr=44*s+Math.sin(t*2)*3*s;
  ctx.globalAlpha=gen*par;ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,cr,0,7);ctx.fill();
  ctx.globalAlpha=gen*par*0.55;ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(cx-cr*0.32,cy-cr*0.32,cr*0.36,0,7);ctx.fill();
  ctx.globalAlpha=1;
}


var actx=null,ambNode=null,ambTip="";
function ambientAyarla(tip){
  if(tip===ambTip)return;ambTip=tip;
  if(ambNode){try{ambNode.g.gain.setTargetAtTime(0,actx.currentTime,0.15);var eski=ambNode;setTimeout(function(){try{eski.src.stop();}catch(e){}},400);}catch(e){}ambNode=null;}
  if(tip!=="yagmurlu"&&tip!=="karli"&&tip!=="bulutlu")return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    var bs=2*actx.sampleRate,buf=actx.createBuffer(1,bs,actx.sampleRate),o=buf.getChannelData(0);
    for(var i=0;i<bs;i++)o[i]=Math.random()*2-1;
    var src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    var flt=actx.createBiquadFilter();flt.type="lowpass";
    var g=actx.createGain();g.gain.value=0;
    var hedef;
    if(tip==="yagmurlu"){flt.frequency.value=1100;hedef=0.20;}
    else if(tip==="karli"){flt.frequency.value=520;hedef=0.10;}
    else{flt.frequency.value=340;hedef=0.09;}
    src.connect(flt);flt.connect(g);g.connect(actx.destination);
    src.start();g.gain.setTargetAtTime(hedef,actx.currentTime,0.4);
    ambNode={src:src,g:g};
  }catch(e){}
}
var t=0,mmix=0,sahneSon=0;
function draw(){
  var hedefMix=MUZIK?1:0;mmix+=(hedefMix-mmix)*0.06;
  t+=0.016*(1+mmix*0.6);
  ctx.clearRect(0,0,W,H);
  var s=SC,col=(TEMA==="dark")?"#6FB4FF":"#378ADD";
  // sahne zaman asimi: konusma bitince yumusakca kaybol
  if(DUR!=="hazir")sahneSon=t;
  var sahneA=(DUR!=="hazir")?1:Math.max(0,1-(t-sahneSon-4)/2);
  // 1) hava efekti
  if(sahneA>0.01&&SAHNE!=="yok") havaCiz(s,sahneA);
  // 2) merkez: muzik varsa DJ, yoksa duygu spektrumu
  // atmosfer aktifken merkez soluklasir, sahne one cikar
  var gen=(1-mmix)*(1-sahneA*0.62);
  if(mmix<0.99&&gen>0.01){merkezCiz(s,col,gen);ctx.globalAlpha=1;}
  // atmosfere gore ambient ses
  ambientAyarla((sahneA>0.06&&SAHNE!=="yok")?SAHNE:"yok");
  if(mmix>0.01){
    ctx.globalAlpha=mmix*0.5;var gg=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*0.5);
    gg.addColorStop(0,"rgba(90,70,200,0.16)");gg.addColorStop(1,"rgba(90,70,200,0)");ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;djCiz(mmix);
  }
  requestAnimationFrame(draw);
}
draw();
