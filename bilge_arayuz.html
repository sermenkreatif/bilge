<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BILGE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;
    font-family:ui-monospace,"SFMono-Regular","Roboto Mono",Consolas,monospace;transition:background .8s;}
  body.dark{background:
    radial-gradient(ellipse at center,#141013 0%,#0A0709 60%,#070406 100%),
    repeating-linear-gradient(0deg,transparent 0 43px,rgba(227,10,23,.035) 43px 44px),
    repeating-linear-gradient(90deg,transparent 0 43px,rgba(227,10,23,.035) 43px 44px);}
  body.light{background:radial-gradient(ellipse at center,#FBF6F6 0%,#F0E6E7 100%);}
  canvas{position:absolute;inset:0;width:100%;height:100%;}

  #saatkutu{position:absolute;top:26px;left:34px;z-index:3;}
  #clk{font-size:56px;font-weight:600;line-height:1;letter-spacing:2px;font-variant-numeric:tabular-nums;}
  #tarihsat{font-size:14px;margin-top:7px;letter-spacing:3px;text-transform:uppercase;opacity:.9;}
  #kunye{margin-top:13px;font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;max-width:330px;line-height:1.6;border-left:2px solid;padding-left:10px;}
  body.dark #clk{color:#F4F6F8;text-shadow:0 0 20px rgba(227,10,23,.5);}
  body.light #clk{color:#2A1416;}
  body.dark #tarihsat{color:#FF3B47;text-shadow:0 0 10px rgba(227,10,23,.5);}
  body.light #tarihsat{color:#C1121F;}
  body.dark #kunye{color:#F0F3F6;border-color:rgba(227,10,23,.7);text-shadow:0 0 8px rgba(255,255,255,.25);}
  body.light #kunye{color:#3A2022;border-color:rgba(193,18,31,.7);}

  #okuma{position:absolute;top:28px;right:34px;z-index:3;text-align:right;}
  .satirok{font-size:12px;letter-spacing:2px;margin:6px 0;display:flex;align-items:center;justify-content:flex-end;gap:9px;text-transform:uppercase;}
  .etik{opacity:.5;}
  .deg{font-weight:600;}
  body.dark .satirok{color:#D8C3C6;} body.light .satirok{color:#6C4C4F;}
  body.dark .deg{color:#FF3B47;} body.light .deg{color:#C1121F;}
  #durumled{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 9px currentColor;}

  #alt{position:absolute;bottom:44px;left:0;right:0;text-align:center;z-index:3;transition:opacity .6s;}
  #ad{font-size:32px;font-weight:600;letter-spacing:18px;padding-left:18px;}
  #durumyazi{font-size:12px;margin-top:13px;letter-spacing:6px;text-transform:uppercase;transition:color .5s;}
  body.dark #ad{color:#F4F6F8;text-shadow:0 0 22px rgba(227,10,23,.55);}
  body.light #ad{color:#2A1416;}
  body.dark #durumyazi{color:#B58C90;} body.light #durumyazi{color:#7C5C5F;}

  #muzikkart{position:absolute;left:34px;bottom:40px;z-index:5;display:flex;align-items:center;gap:11px;
    padding:11px 16px 11px 13px;max-width:360px;opacity:0;transition:opacity .5s;
    border:1px solid;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
  body.dark #muzikkart{background:rgba(26,10,12,.88);border-color:rgba(227,10,23,.55);box-shadow:0 0 22px rgba(227,10,23,.16);}
  body.light #muzikkart{background:rgba(255,255,255,.92);border-color:rgba(193,18,31,.45);}
  #notaikon{width:30px;height:30px;flex-shrink:0;}
  #muzikad{font-size:14px;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #muziketiket{font-size:9px;letter-spacing:3px;opacity:.7;text-transform:uppercase;}
  body.dark #muzikad{color:#F3E8E9;} body.light #muzikad{color:#2A1416;}
  body.dark #muziketiket{color:#FF3B47;} body.light #muziketiket{color:#C1121F;}

  #panel{position:absolute;right:34px;top:150px;bottom:150px;width:370px;max-width:40%;z-index:6;
    display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateX(26px);pointer-events:none;
    transition:opacity .45s,transform .45s;border:1px solid;
    clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));}
  #panel.acik{opacity:1;transform:translateX(0);pointer-events:auto;}
  body.dark #panel{background:rgba(20,8,10,.95);border-color:rgba(227,10,23,.6);box-shadow:0 0 40px rgba(227,10,23,.14);}
  body.light #panel{background:rgba(255,255,255,.97);border-color:rgba(193,18,31,.5);}
  #panelbas{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;flex-shrink:0;}
  #paneltitle{font-size:16px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;line-height:1.3;}
  body.dark #paneltitle{color:#FF3B47;text-shadow:0 0 10px rgba(227,10,23,.4);} body.light #paneltitle{color:#C1121F;}
  #panelkapat{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;padding:0 4px;opacity:.6;font-family:inherit;}
  body.dark #panelkapat{color:#D8C3C6;} body.light #panelkapat{color:#6C4C4F;}
  #panelkapat:hover{opacity:1;}
  #panelust{height:1px;margin:0 18px;flex-shrink:0;}
  body.dark #panelust{background:linear-gradient(90deg,rgba(227,10,23,.7),transparent);}
  body.light #panelust{background:linear-gradient(90deg,rgba(193,18,31,.55),transparent);}
  #panelicerik{padding:14px 18px 18px;overflow-y:auto;font-size:14px;line-height:1.6;}
  body.dark #panelicerik{color:#E8D6D8;} body.light #panelicerik{color:#3A2022;}
  #panelicerik .madde{display:flex;gap:9px;margin:8px 0;}
  #panelicerik .madde:before{content:"";flex-shrink:0;width:6px;height:6px;margin-top:8px;transform:rotate(45deg);}
  body.dark #panelicerik .madde:before{background:#E30A17;box-shadow:0 0 6px rgba(227,10,23,.7);}
  body.light #panelicerik .madde:before{background:#C1121F;}
  #panelicerik .satir{margin:8px 0;}
  #panelicerik::-webkit-scrollbar{width:5px;}
  #panelicerik::-webkit-scrollbar-thumb{background:rgba(227,10,23,.4);}

  #sohbet{position:absolute;right:34px;bottom:40px;z-index:5;width:310px;padding:13px;
    border:1px solid;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
    transition:background .8s;}
  body.dark #sohbet{background:rgba(26,10,12,.88);border-color:rgba(227,10,23,.5);box-shadow:0 0 22px rgba(227,10,23,.12);}
  body.light #sohbet{background:rgba(255,255,255,.92);border-color:rgba(193,18,31,.45);}
  #sohbetbas{font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;opacity:.7;}
  body.dark #sohbetbas{color:#FF3B47;} body.light #sohbetbas{color:#C1121F;}
  #giris{width:100%;height:60px;resize:none;border:none;outline:none;padding:8px 10px;font-size:14px;
    font-family:inherit;line-height:1.35;cursor:text;-webkit-user-select:text;user-select:text;background:transparent;}
  body.dark #giris{color:#F4EAEB;} body.light #giris{color:#2A1416;}
  body.dark #giris::placeholder{color:#946066;} body.light #giris::placeholder{color:#B08A8D;}
  #gonder{margin-top:8px;width:100%;height:36px;border:1px solid;background:none;outline:none;
    font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:inherit;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:.2s;}
  body.dark #gonder{color:#fff;background:#E30A17;border-color:#E30A17;box-shadow:0 0 16px rgba(227,10,23,.4);}
  body.light #gonder{color:#fff;background:#C1121F;border-color:#C1121F;}
  #gonder:active{filter:brightness(1.12);}

  .suzenmesaj{position:absolute;right:44px;bottom:150px;z-index:5;max-width:280px;padding:11px 16px;
    font-size:14px;line-height:1.35;text-align:left;opacity:1;transform:translateY(0);pointer-events:none;
    border:1px solid;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
    transition:transform 1.5s cubic-bezier(.2,.7,.3,1),opacity 1.5s ease;}
  body.dark .suzenmesaj{background:rgba(227,10,23,.16);border-color:rgba(227,10,23,.6);color:#FBEAEB;}
  body.light .suzenmesaj{background:rgba(193,18,31,.12);border-color:rgba(193,18,31,.55);color:#5A1015;}
  .suzenmesaj.git{transform:translateY(-300px) scale(.85);opacity:0;}

  #intro{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s;}
  body.dark #intro{background:#070406;} body.light #intro{background:#F0E6E7;}
  #introName{font-size:64px;font-weight:600;letter-spacing:22px;padding-left:22px;opacity:0;transform:translateY(18px);animation:up 1.1s .3s forwards;}
  body.dark #introName{color:#F4F6F8;text-shadow:0 0 26px rgba(227,10,23,.55);} body.light #introName{color:#2A1416;}
  #introSub{font-size:12px;letter-spacing:8px;margin-top:22px;text-transform:uppercase;opacity:0;animation:fade 1.1s 1s forwards;}
  body.dark #introSub{color:#FF3B47;} body.light #introSub{color:#C1121F;}
  @keyframes up{to{opacity:1;transform:translateY(0);}}
  @keyframes fade{to{opacity:1;}}
</style>
</head>
<body class="dark">
<canvas id="cv"></canvas>

<div id="saatkutu">
  <div id="clk">--:--</div>
  <div id="tarihsat">-</div>
  <div id="kunye">Yapı İşleri ve Teknik Daire Başkanlığı · Ar-Ge Birimi</div>
</div>

<div id="okuma">
  <div class="satirok"><span class="etik">SİSTEM</span><span class="deg" id="okDurum">HAZIR</span><span id="durumled"></span></div>
  <div class="satirok"><span class="etik">BAĞLANTI</span><span class="deg" id="okNet">—</span></div>
  <div class="satirok"><span class="etik">MOD</span><span class="deg" id="okMod">BEKLEME</span></div>
</div>

<div id="alt"><div id="ad">BİLGE</div><div id="durumyazi">HAZIR</div></div>

<div id="muzikkart"><img id="notaikon" alt=""><div><div id="muziketiket">ÇALIYOR</div><div id="muzikad"></div></div></div>

<div id="panel"><div id="panelbas"><span id="paneltitle"></span><button id="panelkapat">&times;</button></div><div id="panelust"></div><div id="panelicerik"></div></div>

<div id="sohbet"><div id="sohbetbas">KOMUT GİRİŞİ</div><textarea id="giris" placeholder="Bana bir şey yaz..."></textarea><button id="gonder">GÖNDER</button></div>

<div id="intro"><div id="introName">BİLGE</div><div id="introSub">SİSTEM BAŞLATILIYOR</div></div>

<script>
var TR_M=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var TR_D=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
function pad(n){return (n<10?"0":"")+n;}
function tick(){var d=new Date();
  document.getElementById("clk").textContent=pad(d.getHours())+":"+pad(d.getMinutes());
  document.getElementById("tarihsat").textContent=TR_D[d.getDay()]+" · "+d.getDate()+" "+TR_M[d.getMonth()]+" "+d.getFullYear();}
setInterval(tick,1000);tick();
function netChk(){document.getElementById("okNet").textContent=navigator.onLine?"AKTİF":"YOK";}
setInterval(netChk,4000);netChk();
setTimeout(function(){var i=document.getElementById("intro");i.style.opacity=0;setTimeout(function(){i.style.display="none";},1000);},2600);

function suzul(m){var d=document.createElement("div");d.className="suzenmesaj";d.textContent=m;
  document.body.appendChild(d);requestAnimationFrame(function(){d.classList.add("git");});
  setTimeout(function(){d.remove();},1700);}
function mesajGonder(){var g=document.getElementById("giris");var m=g.value.trim();if(!m)return;
  g.value="";suzul(m);
  fetch("http://127.0.0.1:8137",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mesaj:m})}).catch(function(e){});}
document.getElementById("gonder").addEventListener("click",mesajGonder);
document.getElementById("giris").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();mesajGonder();}});

var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),dpr,W,H,cx,cy,SC;
function rz(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;SC=Math.min(W,H)/300;}
addEventListener("resize",rz);rz();

var DUR="hazir",MUZIK=false,MUZAD="",SAHNE="yok",TEMA="dark",_panelId="",CANLI=false;
function setTema(t){if(t!=="light"&&t!=="dark")return;if(TEMA===t)return;TEMA=t;document.body.className=t;}

function panelGoster(p){var el=document.getElementById("panel");
  if(!p||!p.icerik){el.classList.remove("acik");_panelId="";return;}
  var yeni=(p.baslik||"")+"|"+p.icerik.length;if(yeni===_panelId)return;_panelId=yeni;
  document.getElementById("paneltitle").textContent=p.baslik||"";
  var ic=document.getElementById("panelicerik");ic.innerHTML="";
  var sat=p.icerik.split("\n");
  for(var i=0;i<sat.length;i++){var st=sat[i].trim();if(!st)continue;var d=document.createElement("div");
    if(/^[\-\*\u2022]\s+/.test(st)){d.className="madde";d.appendChild(document.createTextNode(st.replace(/^[\-\*\u2022]\s+/,"")));}
    else{d.className="satir";d.textContent=st;}ic.appendChild(d);}
  ic.scrollTop=0;el.classList.add("acik");}
function panelKapat(){document.getElementById("panel").classList.remove("acik");_panelId="kapatildi";
  fetch("http://127.0.0.1:8137",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({panel_kapat:true})}).catch(function(e){});}
document.getElementById("panelkapat").addEventListener("click",panelKapat);

function ekranYaz(){
  var mod=MUZIK?"MÜZİK":(DUR==="dusunuyor"?"ANALİZ":DUR==="konusuyor"?"YANIT":"BEKLEME");
  var dz=MUZIK?"MÜZİK":(DUR==="dusunuyor"?"DÜŞÜNÜYOR":DUR==="konusuyor"?"KONUŞUYOR":"HAZIR");
  var od=document.getElementById("okDurum");if(od.textContent!==dz)od.textContent=dz;
  var om=document.getElementById("okMod");if(om.textContent!==mod)om.textContent=mod;
  var dy=document.getElementById("durumyazi");if(dy.textContent!==dz)dy.textContent=dz;
  document.getElementById("durumled").style.color=DUR==="konusuyor"?"#FF3B47":DUR==="dusunuyor"?"#FF9F45":"#37C871";
  var kart=document.getElementById("muzikkart"),ma=document.getElementById("muzikad"),ni=document.getElementById("notaikon");
  if(MUZIK&&MUZAD){ma.textContent=MUZAD;if(!ni.src){ni.onerror=function(){ni.onerror=null;ni.src="https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@master/color/svg/1F3B5.svg";};ni.src="https://openmoji.org/data/color/svg/1F3B5.svg";}kart.style.opacity=1;}else{kart.style.opacity=0;}
}
function poll(){fetch("http://127.0.0.1:8137").then(function(r){return r.json();}).then(function(j){
  CANLI=true;if(j.reload){location.reload();return;}
  DUR=j.d;MUZIK=!!j.muzik;MUZAD=j.muzik_ad||"";SAHNE=(j.sahne===undefined||j.sahne===null)?SAHNE:j.sahne;
  if(j.tema)setTema(j.tema);panelGoster(j.panel);ekranYaz();
}).catch(function(e){demoSur();});}
setInterval(poll,300);

function demoSur(){if(CANLI)return;
  var c=(Date.now()/1000)%40;
  if(c<9){DUR="hazir";MUZIK=false;SAHNE="yok";}
  else if(c<12){DUR="dusunuyor";MUZIK=false;SAHNE="yok";}
  else if(c<18){DUR="konusuyor";MUZIK=false;SAHNE="yok";}
  else if(c<24){DUR="hazir";MUZIK=false;SAHNE="gunesli";}
  else if(c<30){DUR="hazir";MUZIK=true;MUZAD="Tarkan - Kuzu Kuzu";SAHNE="yok";}
  else if(c<35){DUR="hazir";MUZIK=false;SAHNE="yagmurlu";}
  else{DUR="konusuyor";MUZIK=false;SAHNE="yok";}
  ekranYaz();
}

var parcalar=[],SAHNE_AKTIF="yok";
function parcaKur(tip){parcalar=[];var n=(tip==="yagmurlu")?220:(tip==="karli")?140:0;
  for(var i=0;i<n;i++)parcalar.push({x:Math.random()*W,y:Math.random()*H,z:0.4+Math.random()*1.0,r:Math.random()*6.28});}
function sahneKontrol(){if(SAHNE!==SAHNE_AKTIF){SAHNE_AKTIF=SAHNE;parcaKur(SAHNE);}}
function havaCiz(s,sa){sahneKontrol();ctx.save();ctx.globalAlpha=sa;
  if(SAHNE==="gunesli"){
    var g=ctx.createRadialGradient(W-160*s,150*s,10,W-160*s,150*s,Math.max(W,H)*0.9);
    g.addColorStop(0,"rgba(255,190,90,0.32)");g.addColorStop(0.4,"rgba(255,160,70,0.11)");g.addColorStop(1,"rgba(255,160,70,0)");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W-160*s,150*s);ctx.rotate(t*0.25);ctx.strokeStyle="rgba(255,180,60,0.5)";ctx.lineWidth=4*s;
    for(var i=0;i<16;i++){var a=i*Math.PI/8;ctx.beginPath();ctx.moveTo(Math.cos(a)*55*s,Math.sin(a)*55*s);ctx.lineTo(Math.cos(a)*(78+8*Math.sin(t*3+i))*s,Math.sin(a)*(78+8*Math.sin(t*3+i))*s);ctx.stroke();}
    ctx.restore();ctx.fillStyle="rgba(255,195,70,0.9)";ctx.beginPath();ctx.arc(W-160*s,150*s,42*s,0,7);ctx.fill();
  } else if(SAHNE==="yagmurlu"){
    ctx.strokeStyle="rgba(120,190,235,0.6)";ctx.lineWidth=2;
    for(var i=0;i<parcalar.length;i++){var p=parcalar[i];p.y+=18*p.z;p.x-=3*p.z;if(p.y>H){p.y=-20;p.x=Math.random()*W;}
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-4*p.z,p.y+18*p.z);ctx.stroke();}
  } else if(SAHNE==="karli"){
    ctx.fillStyle="rgba(235,244,255,0.92)";
    for(var i=0;i<parcalar.length;i++){var p=parcalar[i];p.y+=1.6*p.z;p.x+=Math.sin(t+p.r)*0.7;if(p.y>H){p.y=-10;p.x=Math.random()*W;}
      ctx.beginPath();ctx.arc(p.x,p.y,2.4*p.z,0,7);ctx.fill();}
  } else if(SAHNE==="bulutlu"){
    ctx.fillStyle="rgba(150,175,200,0.26)";
    for(var i=0;i<5;i++){var bx=((t*14*(0.5+i*0.18)+i*340)%(W+500))-250,by=90*s+i*66*s;
      ctx.beginPath();ctx.ellipse(bx,by,100*s,36*s,0,0,7);ctx.ellipse(bx+66*s,by+12*s,66*s,28*s,0,0,7);ctx.ellipse(bx-56*s,by+10*s,56*s,24*s,0,0,7);ctx.fill();}
  }
  ctx.restore();}

var djbar=[];for(var i=0;i<52;i++)djbar.push({f:Math.random()*6.28,h:0});
function djCiz(mix,ana){
  var n=djbar.length,gap=5*SC,bw=Math.min(15*SC,(W*0.7)/n-gap),tot=n*(bw+gap)-gap,x0=cx-tot/2,taban=cy+40*SC;
  for(var i=0;i<n;i++){var b=djbar[i];
    var hedef=(0.18+0.82*Math.abs(Math.sin(t*5+b.f)*0.55+Math.sin(t*8.3-b.f*1.4)*0.3+Math.sin(t*3.1+i)*0.15))*140*SC;
    b.h+=(hedef-b.h)*0.3;var x=x0+i*(bw+gap),h=b.h*mix;
    var gr=ctx.createLinearGradient(0,taban-h,0,taban);
    gr.addColorStop(0,"rgba("+ana[0]+","+ana[1]+","+ana[2]+","+(0.95*mix)+")");
    gr.addColorStop(1,"rgba("+ana[0]+","+ana[1]+","+ana[2]+","+(0.12*mix)+")");
    ctx.fillStyle=gr;ctx.fillRect(x,taban-h,bw,h);
    ctx.fillStyle="rgba("+ana[0]+","+ana[1]+","+ana[2]+","+(0.9*mix)+")";ctx.fillRect(x,taban-h-2*SC,bw,2*SC);}
}

function cerceve(col,a){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=1.5;
  var m=26,L=46,koseler=[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]];
  for(var i=0;i<4;i++){var k=koseler[i];ctx.beginPath();
    ctx.moveTo(k[0]+k[2]*L,k[1]);ctx.lineTo(k[0],k[1]);ctx.lineTo(k[0],k[1]+k[3]*L);ctx.stroke();
    ctx.beginPath();ctx.arc(k[0]+k[2]*8,k[1]+k[3]*8,2,0,7);ctx.fillStyle=col;ctx.fill();}
  ctx.globalAlpha=a*0.5;
  ctx.beginPath();ctx.moveTo(cx-14,m);ctx.lineTo(cx+14,m);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-14,H-m);ctx.lineTo(cx+14,H-m);ctx.stroke();
  ctx.restore();}

// ---------- MERKEZ: dunya/gezegen sistemi ----------
var yoru=[
  {R:0.52,tilt:1.14,spd:0.62,dir:1,ph:0.0,gez:6.5,renk:1},
  {R:0.72,tilt:1.34,spd:-0.44,dir:-1,ph:2.1,gez:5.4,renk:0},
  {R:0.92,tilt:1.02,spd:0.34,dir:1,ph:4.0,gez:8.0,renk:1},
  {R:1.10,tilt:1.42,spd:-0.26,dir:-1,ph:5.4,gez:5.0,renk:0}
];
var pulse=[],lp=0,radar=0;
function rotX(p,a){var c=Math.cos(a),s=Math.sin(a);return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c];}
function rotY(p,a){var c=Math.cos(a),s=Math.sin(a);return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c];}
function merkez(s,ana,beyaz,gen){
  var kir="rgba("+ana[0]+","+ana[1]+","+ana[2]+",";
  var bey="rgba("+beyaz[0]+","+beyaz[1]+","+beyaz[2]+",";
  var dim=(TEMA==="dark")?"rgba(96,58,63,":"rgba(180,150,152,";
  var Rc=124*s;
  var amp=(DUR==="konusuyor")?1:(DUR==="dusunuyor")?0.6:0.32;

  // --- dis HUD tik halka ---
  ctx.globalAlpha=gen;ctx.strokeStyle=dim+"1)";ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,158*s,0,7);ctx.stroke();
  for(var i=0;i<72;i++){var a=i*Math.PI/36,r1=158*s,r2=(i%6===0?170:164)*s;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);ctx.stroke();}
  var hiz=(DUR==="dusunuyor")?1.8:(DUR==="konusuyor")?1.1:0.4;
  ctx.strokeStyle=kir+(0.9*gen)+")";ctx.lineWidth=2.6;
  for(var k=0;k<3;k++){var b=t*hiz+k*2.09;ctx.beginPath();ctx.arc(cx,cy,149*s,b,b+0.5);ctx.stroke();}
  ctx.strokeStyle=bey+(0.6*gen)+")";ctx.lineWidth=1.6;
  for(var k=0;k<3;k++){var b=-t*hiz*0.7+k*2.09;ctx.beginPath();ctx.arc(cx,cy,140*s,b,b+0.42);ctx.stroke();}
  // radar
  radar+=0.012*(1+(DUR!=="hazir"?1:0));
  var rg=ctx.createLinearGradient(cx,cy,cx+Math.cos(radar)*158*s,cy+Math.sin(radar)*158*s);
  rg.addColorStop(0,kir+"0)");rg.addColorStop(1,kir+(0.30*gen)+")");
  ctx.strokeStyle=rg;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(radar)*154*s,cy+Math.sin(radar)*154*s);ctx.stroke();

  // --- merkez isima (kirmizi haze) ---
  var hz=ctx.createRadialGradient(cx,cy,2,cx,cy,Rc);
  hz.addColorStop(0,kir+(0.24*gen*(0.6+amp*0.4))+")");hz.addColorStop(0.5,kir+(0.07*gen)+")");hz.addColorStop(1,kir+"0)");
  ctx.fillStyle=hz;ctx.beginPath();ctx.arc(cx,cy,Rc,0,7);ctx.fill();

  // === YORUNGE IZLERI (arka + on) ===
  function gezPozisyon(y){var ang=t*y.spd*y.dir+y.ph;var p=[Math.cos(ang)*Rc*y.R,0,Math.sin(ang)*Rc*y.R];p=rotX(p,y.tilt);return p;}
  for(var o=0;o<yoru.length;o++){var y=yoru[o];var rc=(y.renk===1)?ana:beyaz;var cc="rgba("+rc[0]+","+rc[1]+","+rc[2]+",";
    for(var half=0;half<2;half++){
      ctx.beginPath();var basla=true;
      for(var a=0;a<=72;a++){var th=a/72*Math.PI*2;var p=[Math.cos(th)*Rc*y.R,0,Math.sin(th)*Rc*y.R];p=rotX(p,y.tilt);
        var on=(p[2]>=0);if(on!==(half===1)){basla=true;continue;}
        var px=cx+p[0],py=cy+p[1];if(basla){ctx.moveTo(px,py);basla=false;}else ctx.lineTo(px,py);}
      ctx.globalAlpha=gen*(half===1?0.72:0.22);ctx.strokeStyle=cc+"1)";ctx.lineWidth=(half===1?1.8:1.2);ctx.stroke();
    }
  }

  // --- DUNYA (telkafes kure, dotlu) ---
  ctx.globalAlpha=1;var Rg=66*s,sg=t*0.22;
  // paralel (enlem)
  for(var la=-60;la<=60;la+=20){var yy=Math.sin(la*Math.PI/180),rr=Math.cos(la*Math.PI/180);
    for(var lo=0;lo<360;lo+=12){var lr=lo*Math.PI/180;var p=[rr*Math.cos(lr),yy,rr*Math.sin(lr)];p=rotY(p,sg);
      var depth=(p[2]+1)/2;ctx.globalAlpha=gen*(0.16+0.72*depth);ctx.fillStyle=bey+"1)";
      var sz=(0.9+1.4*depth)*s;ctx.fillRect(cx+p[0]*Rg-sz/2,cy+p[1]*Rg-sz/2,sz,sz);}}
  // meridyen (boylam)
  for(var lo=0;lo<360;lo+=24){var lr=lo*Math.PI/180;
    for(var la=-82;la<=82;la+=11){var yy=Math.sin(la*Math.PI/180),rr=Math.cos(la*Math.PI/180);
      var p=[rr*Math.cos(lr),yy,rr*Math.sin(lr)];p=rotY(p,sg);
      var depth=(p[2]+1)/2;ctx.globalAlpha=gen*(0.14+0.66*depth);ctx.fillStyle=kir+"1)";
      var sz=(0.9+1.3*depth)*s;ctx.fillRect(cx+p[0]*Rg-sz/2,cy+p[1]*Rg-sz/2,sz,sz);}}
  // ekvator parlak halka
  ctx.globalAlpha=gen*0.5;ctx.strokeStyle=kir+"1)";ctx.lineWidth=1.4;
  ctx.beginPath();ctx.ellipse(cx,cy,Rg,Rg*0.32,0,0,7);ctx.stroke();
  // cekirdek glow + nokta
  var cg=ctx.createRadialGradient(cx,cy,1,cx,cy,Rg*0.85);
  cg.addColorStop(0,kir+(0.55*gen)+")");cg.addColorStop(1,kir+"0)");
  ctx.globalAlpha=1;ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,Rg*0.85,0,7);ctx.fill();
  ctx.globalAlpha=gen*(0.6+amp*0.4);ctx.fillStyle=bey+"1)";
  ctx.beginPath();ctx.arc(cx,cy,3*s+Math.sin(t*3)*1.2*s,0,7);ctx.fill();

  // === GEZEGENLER ===
  for(var o=0;o<yoru.length;o++){var y=yoru[o];var p=gezPozisyon(y);var rc=(y.renk===1)?ana:beyaz;var cc="rgba("+rc[0]+","+rc[1]+","+rc[2]+",";
    var depth=(p[2]/(Rc*y.R)+1)/2;if(depth<0)depth=0;if(depth>1)depth=1;
    var gr2=Math.max(1,(y.gez*(0.55+0.75*depth))*s);var al=Math.max(0,Math.min(1,gen*(0.4+0.6*depth)));
    var px=cx+p[0],py=cy+p[1];
    var pg=ctx.createRadialGradient(px,py,0.5,px,py,gr2*2.6);
    pg.addColorStop(0,cc+al+")");pg.addColorStop(0.5,cc+(al*0.35)+")");pg.addColorStop(1,cc+"0)");
    ctx.globalAlpha=1;ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,gr2*2.6,0,7);ctx.fill();
    ctx.fillStyle=cc+al+")";ctx.beginPath();ctx.arc(px,py,gr2,0,7);ctx.fill();
    ctx.fillStyle=bey+(al*0.9)+")";ctx.beginPath();ctx.arc(px-gr2*0.3,py-gr2*0.3,gr2*0.34,0,7);ctx.fill();
  }

  // pulse
  var ph2=(DUR==="konusuyor")?2.2:(DUR==="dusunuyor")?1.6:1;
  if(t-lp>1.5/ph2){pulse.push({r:Rg*1.02,a:.22});lp=t;}
  for(var p2=pulse.length-1;p2>=0;p2--){var pl=pulse[p2];pl.r+=1.0*ph2*s;pl.a*=.972;
    if(pl.a<.015){pulse.splice(p2,1);continue;}
    ctx.globalAlpha=gen*pl.a;ctx.strokeStyle=kir+"1)";ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(cx,cy,pl.r,0,7);ctx.stroke();}
  ctx.globalAlpha=1;
}

var actx=null,ambNode=null,ambTip="";
function ambientAyarla(tip){
  if(tip===ambTip)return;ambTip=tip;
  if(ambNode){try{ambNode.g.gain.setTargetAtTime(0,actx.currentTime,0.15);var eski=ambNode;setTimeout(function(){try{eski.src.stop();}catch(e){}},400);}catch(e){}ambNode=null;}
  if(tip!=="yagmurlu"&&tip!=="karli"&&tip!=="bulutlu")return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    var bs=2*actx.sampleRate,buf=actx.createBuffer(1,bs,actx.sampleRate),o=buf.getChannelData(0);
    for(var i=0;i<bs;i++)o[i]=Math.random()*2-1;
    var src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    var flt=actx.createBiquadFilter();flt.type="lowpass";
    var g=actx.createGain();g.gain.value=0;var hedef;
    if(tip==="yagmurlu"){flt.frequency.value=1100;hedef=0.20;}
    else if(tip==="karli"){flt.frequency.value=520;hedef=0.10;}
    else{flt.frequency.value=340;hedef=0.09;}
    src.connect(flt);flt.connect(g);g.connect(actx.destination);src.start();
    g.gain.setTargetAtTime(hedef,actx.currentTime,0.4);ambNode={src:src,g:g};
  }catch(e){}
}

var t=0,mmix=0,sahneSon=0;
function draw(){try{cizKare();}catch(e){}requestAnimationFrame(draw);}
function cizKare(){
  var hedefMix=MUZIK?1:0;mmix+=(hedefMix-mmix)*0.06;
  t+=0.016*(1+mmix*0.6);
  ctx.clearRect(0,0,W,H);
  var s=SC;
  var ana=(TEMA==="dark")?[227,10,23]:[193,18,31];
  var beyaz=(TEMA==="dark")?[238,242,246]:[70,50,52];
  var cframe=(TEMA==="dark")?"rgba(227,10,23,0.55)":"rgba(193,18,31,0.5)";
  cerceve(cframe,0.9);
  if(DUR!=="hazir")sahneSon=t;
  var sahneA=(DUR!=="hazir")?1:Math.max(0,1-(t-sahneSon)/0.8);
  if(sahneA>0.01&&SAHNE!=="yok")havaCiz(s,sahneA);
  var gen=(1-mmix)*(1-sahneA*0.62);
  if(mmix<0.99&&gen>0.01){merkez(s,ana,beyaz,gen);ctx.globalAlpha=1;}
  ambientAyarla((sahneA>0.06&&SAHNE!=="yok")?SAHNE:"yok");
  if(mmix>0.01){
    ctx.globalAlpha=mmix*0.5;var gg=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*0.5);
    gg.addColorStop(0,"rgba("+ana[0]+","+ana[1]+","+ana[2]+",0.14)");gg.addColorStop(1,"rgba("+ana[0]+","+ana[1]+","+ana[2]+",0)");
    ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;djCiz(mmix,ana);}
  var altEl=document.getElementById("alt");altEl.style.opacity=(1-sahneA*0.5)*(1-mmix*0.35);
}
draw();
</script>
