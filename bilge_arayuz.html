<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BİLGE</title>
<style>
:root{--kirmizi:#e01020;--parlak:#ff3545;--koyu:#8a0a12;--zemin:#0a0304;--yazi:#ffcfd3;--yesil:#25d366}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--zemin);font-family:'Segoe UI',system-ui,sans-serif}
body.light{--zemin:#f4eef0;--yazi:#4a0c12}
#sahne{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#1c0609 0%,var(--zemin) 72%)}
body.light #sahne{background:radial-gradient(circle at 50% 50%,#ffe2e5 0%,var(--zemin) 72%)}
canvas{display:block}
/* SOL UST: saat + tarih */
#saat{position:fixed;top:28px;left:36px;z-index:6;color:var(--parlak);text-shadow:0 0 14px var(--kirmizi)}
#saatBuyuk{font-size:clamp(34px,4.6vw,56px);font-weight:700;letter-spacing:.03em;line-height:1}
#tarih{font-size:clamp(13px,1.6vw,18px);letter-spacing:.2em;color:var(--yazi);opacity:.85;margin-top:8px;text-transform:uppercase}
/* SAG UST: durum gostergeleri */
#durumlar{position:fixed;top:30px;right:36px;z-index:6;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.rozet{display:flex;align-items:center;gap:9px;font-size:14px;letter-spacing:.12em;color:var(--yazi);text-transform:uppercase}
.nokta{width:11px;height:11px;border-radius:50%;background:#555;box-shadow:0 0 8px #000}
.nokta.on{background:var(--yesil);box-shadow:0 0 10px var(--yesil)}
.nokta.kirmizi{background:var(--parlak);box-shadow:0 0 10px var(--kirmizi)}
/* MERKEZ */
#merkez{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:5}
#ad{font-size:clamp(40px,8vw,90px);font-weight:800;letter-spacing:.4em;color:var(--parlak);
  text-shadow:0 0 24px var(--kirmizi),0 0 60px var(--koyu);padding-left:.4em}
#durum{margin-top:18px;font-size:clamp(13px,1.8vw,18px);letter-spacing:.4em;color:var(--yazi);opacity:.8;text-transform:uppercase}
/* BALON */
#balon{position:fixed;top:calc(50% + 150px);left:50%;transform:translateX(-50%);max-width:62vw;text-align:center;
  font-size:clamp(16px,2.1vw,22px);color:#fff;opacity:0;transition:opacity .35s;z-index:6;padding:0 20px;line-height:1.5;text-shadow:0 0 14px var(--koyu)}
#balon.gor{opacity:.96}
/* PANEL */
#panel{position:fixed;top:50%;right:3vw;transform:translateY(-50%);width:min(38vw,440px);max-height:76vh;
  background:rgba(24,5,8,.9);border:2px solid var(--kirmizi);border-radius:16px;padding:24px 26px;
  box-shadow:0 0 50px rgba(224,16,32,.45);overflow-y:auto;display:none;z-index:8}
body.light #panel{background:rgba(255,245,246,.94);color:#4a0c12}
#panel.acik{display:block;animation:gp .4s ease}
@keyframes gp{from{opacity:0;transform:translateY(-50%) translateX(40px)}to{opacity:1;transform:translateY(-50%) translateX(0)}}
#pBaslik{font-size:22px;font-weight:700;color:var(--parlak);margin-bottom:16px}
#pIcerik div{font-size:16px;line-height:1.7;color:var(--yazi);padding:6px 0 6px 18px;position:relative}
#pIcerik div:before{content:"";position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:50%;background:var(--kirmizi);box-shadow:0 0 8px var(--kirmizi)}
/* MUZIK */
#muzik{position:fixed;left:36px;bottom:36px;background:rgba(24,5,8,.88);border:2px solid var(--koyu);
  border-radius:14px;padding:14px 20px;display:none;align-items:center;gap:14px;z-index:8;max-width:42vw}
#muzik.acik{display:flex}
.eq{display:flex;gap:4px;align-items:flex-end;height:26px}
.eq i{width:4px;background:var(--parlak);border-radius:2px;animation:eq .9s ease-in-out infinite;box-shadow:0 0 6px var(--kirmizi)}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:6px}50%{height:26px}}
#muzikAd{font-size:15px;color:var(--yazi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
/* SOHBET KUTUSU */
#kutu{position:fixed;right:36px;bottom:36px;z-index:9;display:flex;gap:10px;align-items:center}
#giris{width:min(32vw,360px);background:rgba(24,5,8,.85);border:2px solid var(--kirmizi);border-radius:26px;
  padding:14px 22px;color:#fff;font-size:16px;outline:none;box-shadow:0 0 20px rgba(224,16,32,.3)}
#giris::placeholder{color:var(--yazi);opacity:.6}
#giris:focus{border-color:var(--parlak);box-shadow:0 0 28px rgba(255,53,69,.5)}
#gonder{background:var(--kirmizi);border:none;border-radius:50%;width:50px;height:50px;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 0 18px rgba(224,16,32,.5)}
#gonder:active{background:var(--parlak)}
/* ACILIS */
#acilis{position:fixed;inset:0;background:var(--zemin);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity 1s}
#acilis span{font-size:clamp(40px,9vw,100px);font-weight:800;letter-spacing:.45em;color:var(--parlak);text-shadow:0 0 40px var(--kirmizi);padding-left:.45em;animation:nb 1.8s ease-in-out infinite}
@keyframes nb{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>
<div id="sahne"><canvas id="c"></canvas></div>
<div id="saat"><div id="saatBuyuk">--:--</div><div id="tarih">—</div></div>
<div id="durumlar">
  <div class="rozet"><span id="nBaglanti" class="nokta"></span>BAĞLANTI</div>
  <div class="rozet"><span id="nMikrofon" class="nokta on"></span>MİKROFON</div>
  <div class="rozet"><span id="nSes" class="nokta"></span>SES</div>
</div>
<div id="merkez"><div id="ad">BİLGE</div><div id="durum">hazır</div></div>
<div id="balon"></div>
<div id="panel"><div id="pBaslik"></div><div id="pIcerik"></div></div>
<div id="muzik"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div id="muzikAd"></div></div>
<div id="kutu"><input id="giris" placeholder="Bilge'ye yaz..." autocomplete="off"><button id="gonder">➤</button></div>
<div id="acilis"><span>BİLGE</span></div>

<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W,H,CX,CY,R;
function boyut(){W=cv.width=innerWidth;H=cv.height=innerHeight;CX=W/2;CY=H/2;R=Math.min(W,H)*0.36;}
addEventListener("resize",boyut);boyut();

let durum="hazir",hiz=1,hedefHiz=1,parlak=0.6,hedefParlak=0.6,t=0;
// YORUNGESEL halkalar: merkezleri hafif kaymis (referanstaki gibi), bazilari kesikli
const halkalar=[
  {r:1.00,kalin:5,hiz:0.10,dash:null,op:1.0,ox:0,oy:0},
  {r:0.90,kalin:2,hiz:-0.15,dash:[6,16],op:0.7,ox:0.05,oy:-0.03},
  {r:0.78,kalin:3,hiz:0.20,dash:[20,28],op:0.75,ox:-0.06,oy:0.04},
  {r:0.64,kalin:2,hiz:-0.28,dash:[4,10],op:0.6,ox:0.08,oy:0.05},
  {r:0.50,kalin:4,hiz:0.38,dash:null,op:0.85,ox:-0.04,oy:-0.06},
  {r:0.36,kalin:2,hiz:-0.5,dash:[2,8],op:0.55,ox:0.03,oy:0.03}
];
function ciz(){
  t+=0.016*hiz;
  hiz+=(hedefHiz-hiz)*0.06;parlak+=(hedefParlak-parlak)*0.06;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,R*1.2);
  g.addColorStop(0,`rgba(255,53,69,${0.4*parlak})`);
  g.addColorStop(0.35,`rgba(224,16,32,${0.18*parlak})`);
  g.addColorStop(1,"rgba(224,16,32,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,R*1.2,0,7);ctx.fill();
  ctx.shadowColor="rgba(255,53,69,0.8)";
  halkalar.forEach(h=>{
    const rr=R*h.r, ox=h.ox*R*Math.cos(t*0.3), oy=h.oy*R*Math.sin(t*0.3);
    ctx.save();ctx.translate(CX+ox,CY+oy);ctx.rotate(t*h.hiz*3);
    ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,53,69,${h.op})`;ctx.lineWidth=h.kalin;ctx.shadowBlur=12;
    ctx.setLineDash(h.dash||[]);ctx.stroke();
    ctx.restore();
  });
  ctx.shadowBlur=0;
  ctx.save();ctx.translate(CX,CY);ctx.rotate(-t*0.05);
  for(let a=0;a<72;a++){
    const ang=(a/72)*Math.PI*2,buyuk=a%6===0,uz=buyuk?18:9;
    const x1=Math.cos(ang)*(R*1.08),y1=Math.sin(ang)*(R*1.08);
    const x2=Math.cos(ang)*(R*1.08+uz),y2=Math.sin(ang)*(R*1.08+uz);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=`rgba(255,53,69,${buyuk?0.9:0.4})`;ctx.lineWidth=buyuk?2.5:1.2;ctx.stroke();
  }
  ctx.restore();
  if(durum==="konusuyor"||durum==="dinliyor"){
    const p=0.5+0.5*Math.sin(t*8);
    ctx.beginPath();ctx.arc(CX,CY,R*0.30*(1+p*0.18),0,7);
    ctx.strokeStyle=`rgba(255,53,69,${0.4+p*0.5})`;ctx.lineWidth=3;ctx.setLineDash([]);
    ctx.shadowColor="rgba(255,53,69,1)";ctx.shadowBlur=16;ctx.stroke();ctx.shadowBlur=0;
  }
  requestAnimationFrame(ciz);
}
ciz();

function durumAyarla(d){
  durum=d;
  document.getElementById("durum").textContent={hazir:"hazır",dinliyor:"dinliyor",dusunuyor:"düşünüyor",konusuyor:"konuşuyor"}[d]||"hazır";
  document.getElementById("nSes").className="nokta"+(d==="konusuyor"?" kirmizi":"");
  if(d==="dusunuyor"){hedefHiz=2.6;hedefParlak=0.9;}
  else if(d==="konusuyor"){hedefHiz=1.9;hedefParlak=1.0;}
  else if(d==="dinliyor"){hedefHiz=1.3;hedefParlak=0.75;}
  else{hedefHiz=1;hedefParlak=0.6;}
}

const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
function saatGuncelle(){
  const n=new Date();
  document.getElementById("saatBuyuk").textContent=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  document.getElementById("tarih").textContent=n.getDate()+" "+AYLAR[n.getMonth()]+" "+GUNLER[n.getDay()];
}
saatGuncelle();setInterval(saatGuncelle,1000);

function panelGoster(p){
  const el=document.getElementById("panel");
  if(!p){el.classList.remove("acik");return;}
  document.getElementById("pBaslik").textContent=p.baslik||"";
  const ic=document.getElementById("pIcerik");ic.innerHTML="";
  (p.icerik||"").split("\n").forEach(s=>{s=s.replace(/^-\s*/,"").trim();if(s){const d=document.createElement("div");d.textContent=s;ic.appendChild(d);}});
  el.classList.add("acik");
}
function muzikGoster(a,ad){
  const el=document.getElementById("muzik");
  document.getElementById("nSes").className="nokta"+(a?" on":"");
  if(a){document.getElementById("muzikAd").textContent=ad||"Müzik";el.classList.add("acik");}else el.classList.remove("acik");
}
function temaAyarla(t){document.body.classList.toggle("light",t==="light");}

let sonP="",sonM="";
function poll(){
  fetch("http://127.0.0.1:8137/").then(r=>r.json()).then(j=>{
    document.getElementById("nBaglanti").className="nokta on";  // sunucuya erisildi
    durumAyarla(j.d);
    const pj=JSON.stringify(j.panel||"");if(pj!==sonP){sonP=pj;panelGoster(j.panel);}
    const mj=(j.muzik?"1":"0")+(j.muzik_ad||"");if(mj!==sonM){sonM=mj;muzikGoster(j.muzik,j.muzik_ad);}
    temaAyarla(j.tema);
  }).catch(e=>{document.getElementById("nBaglanti").className="nokta";});  // baglanti yok
}
setInterval(poll,300);

function gonder(){
  const g=document.getElementById("giris"),m=g.value.trim();if(!m)return;g.value="";
  const b=document.getElementById("balon");b.textContent=m;b.classList.add("gor");
  clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove("gor"),3000);
  fetch("http://127.0.0.1:8137",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mesaj:m})}).catch(e=>{});
}
document.getElementById("gonder").onclick=gonder;
document.getElementById("giris").addEventListener("keydown",e=>{if(e.key==="Enter")gonder();});

setTimeout(()=>{const a=document.getElementById("acilis");a.style.opacity=0;setTimeout(()=>a.style.display="none",1000);},2200);
</script>
</body>
</html>
