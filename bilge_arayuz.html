<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BILGE</title>
<style>
:root{
  --kirmizi:#c1121f; --kirmizi-parlak:#ff2a3a; --kirmizi-koyu:#7a0c14;
  --zemin:#080305; --yazi:#ffd9dc;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--zemin);font-family:'Segoe UI',system-ui,sans-serif}
body.light{--zemin:#f4eef0;--yazi:#3a0c12}
#sahne{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%, #1a0508 0%, var(--zemin) 70%)}
body.light #sahne{background:radial-gradient(circle at 50% 50%, #ffe2e5 0%, var(--zemin) 70%)}
canvas{display:block}
/* merkez yazi */
#merkez{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:5}
#ad{font-size:clamp(28px,6vw,64px);font-weight:700;letter-spacing:.35em;color:var(--kirmizi-parlak);
  text-shadow:0 0 18px var(--kirmizi),0 0 40px var(--kirmizi-koyu);padding-left:.35em}
#durum{margin-top:14px;font-size:clamp(11px,1.6vw,15px);letter-spacing:.3em;color:var(--yazi);opacity:.75;text-transform:uppercase}
/* panel */
#panel{position:fixed;top:50%;right:4vw;transform:translateY(-50%);width:min(38vw,440px);max-height:80vh;
  background:rgba(20,4,7,.82);border:1px solid var(--kirmizi);border-radius:14px;padding:22px 24px;
  box-shadow:0 0 40px rgba(193,18,31,.35);backdrop-filter:blur(8px);overflow-y:auto;display:none;z-index:8}
body.light #panel{background:rgba(255,245,246,.9);color:#3a0c12}
#panel.acik{display:block;animation:girP .4s ease}
@keyframes girP{from{opacity:0;transform:translateY(-50%) translateX(30px)}to{opacity:1;transform:translateY(-50%) translateX(0)}}
#panelBaslik{font-size:20px;font-weight:700;color:var(--kirmizi-parlak);margin-bottom:14px;letter-spacing:.04em}
#panelIcerik{font-size:15px;line-height:1.75;color:var(--yazi)}
#panelIcerik div{padding:5px 0 5px 16px;position:relative}
#panelIcerik div:before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--kirmizi)}
/* muzik karti */
#muzik{position:fixed;left:3vw;bottom:3vh;background:rgba(20,4,7,.8);border:1px solid var(--kirmizi-koyu);
  border-radius:12px;padding:12px 18px;display:none;align-items:center;gap:12px;z-index:8;max-width:40vw}
#muzik.acik{display:flex;animation:girM .4s ease}
@keyframes girM{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:3px;background:var(--kirmizi-parlak);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}
#muzikAd{font-size:14px;color:var(--yazi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
/* sohbet kutusu */
#kutu{position:fixed;right:3vw;bottom:3vh;z-index:9;display:flex;gap:8px}
#giris{width:min(30vw,320px);background:rgba(20,4,7,.75);border:1px solid var(--kirmizi-koyu);border-radius:24px;
  padding:12px 18px;color:var(--yazi);font-size:15px;outline:none}
#giris:focus{border-color:var(--kirmizi)}
#gonder{background:var(--kirmizi);border:none;border-radius:50%;width:44px;height:44px;color:#fff;font-size:18px;cursor:pointer}
/* konusma balonu */
#balon{position:fixed;top:50%;left:50%;transform:translate(-50%,120px);max-width:60vw;text-align:center;
  font-size:clamp(15px,2vw,20px);color:var(--yazi);opacity:0;transition:opacity .4s;z-index:6;padding:0 20px;line-height:1.5}
#balon.gor{opacity:.95}
/* acilis */
#acilis{position:fixed;inset:0;background:var(--zemin);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity 1s}
#acilis span{font-size:clamp(30px,7vw,72px);font-weight:700;letter-spacing:.4em;color:var(--kirmizi-parlak);
  text-shadow:0 0 30px var(--kirmizi);padding-left:.4em;animation:nb 2s ease-in-out infinite}
@keyframes nb{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>
<div id="sahne"><canvas id="c"></canvas></div>
<div id="merkez"><div id="ad">BİLGE</div><div id="durum">hazır</div></div>
<div id="balon"></div>
<div id="panel"><div id="panelBaslik"></div><div id="panelIcerik"></div></div>
<div id="muzik"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div id="muzikAd"></div></div>
<div id="kutu"><input id="giris" placeholder="Bilge'ye yaz..." autocomplete="off"><button id="gonder">➤</button></div>
<div id="acilis"><span>BİLGE</span></div>

<script>
// ---------- Canvas: ic ice donen kesikli halkalar + merkez parlama ----------
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W,H,CX,CY,R;
function boyut(){W=cv.width=innerWidth;H=cv.height=innerHeight;CX=W/2;CY=H/2;R=Math.min(W,H)*0.34;}
addEventListener("resize",boyut);boyut();

let durum="hazir";        // hazir | dinliyor | dusunuyor | konusuyor
let hiz=1, hedefHiz=1, parlak=0.5, hedefParlak=0.5;
const halkalar=[
  {r:1.00, kalin:2.2, hiz:0.10, kesik:[2,10], op:0.9},
  {r:0.86, kalin:1.4, hiz:-0.16, kesik:[4,8], op:0.55},
  {r:0.70, kalin:1.2, hiz:0.22, kesik:[3,14], op:0.5},
  {r:0.54, kalin:1.0, hiz:-0.30, kesik:[2,6], op:0.4},
  {r:0.40, kalin:1.6, hiz:0.40, kesik:[1,20], op:0.6}
];
let t=0;
function ciz(){
  t+=0.016*hiz;
  hiz+=(hedefHiz-hiz)*0.06; parlak+=(hedefParlak-parlak)*0.06;
  ctx.clearRect(0,0,W,H);
  // merkez radyal parlama
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,R*1.1);
  g.addColorStop(0,`rgba(255,42,58,${0.28*parlak})`);
  g.addColorStop(0.4,`rgba(193,18,31,${0.12*parlak})`);
  g.addColorStop(1,"rgba(193,18,31,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,R*1.1,0,7); ctx.fill();
  // halkalar
  halkalar.forEach((h,i)=>{
    const rr=R*h.r;
    ctx.save(); ctx.translate(CX,CY); ctx.rotate(t*h.hiz*3);
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,42,58,${h.op})`; ctx.lineWidth=h.kalin;
    ctx.setLineDash(h.kesik.map(x=>x*3)); ctx.stroke();
    ctx.restore();
  });
  // dis tik isaretleri
  ctx.save(); ctx.translate(CX,CY); ctx.rotate(-t*0.05);
  for(let a=0;a<60;a++){
    const ang=(a/60)*Math.PI*2, uz=(a%5===0)?14:7;
    const x1=Math.cos(ang)*(R*1.06), y1=Math.sin(ang)*(R*1.06);
    const x2=Math.cos(ang)*(R*1.06+uz), y2=Math.sin(ang)*(R*1.06+uz);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=`rgba(193,18,31,${a%5===0?0.8:0.35})`;ctx.lineWidth=a%5===0?2:1;ctx.stroke();
  }
  ctx.restore();
  // konusurken/dinlerken titresim halkasi
  if(durum==="konusuyor"||durum==="dinliyor"){
    const p=0.5+0.5*Math.sin(t*8);
    ctx.beginPath();ctx.arc(CX,CY,R*0.30*(1+p*0.15),0,7);
    ctx.strokeStyle=`rgba(255,42,58,${0.3+p*0.4})`;ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();
  }
  requestAnimationFrame(ciz);
}
ciz();

function durumAyarla(d){
  durum=d;
  const et={hazir:"hazır",dinliyor:"dinliyor",dusunuyor:"düşünüyor",konusuyor:"konuşuyor"}[d]||"hazır";
  document.getElementById("durum").textContent=et;
  if(d==="dusunuyor"){hedefHiz=2.4;hedefParlak=0.8;}
  else if(d==="konusuyor"){hedefHiz=1.8;hedefParlak=1.0;}
  else if(d==="dinliyor"){hedefHiz=1.3;hedefParlak=0.7;}
  else{hedefHiz=1;hedefParlak=0.5;}
}

// ---------- Panel / muzik / tema ----------
function panelGoster(p){
  const el=document.getElementById("panel");
  if(!p){el.classList.remove("acik");return;}
  document.getElementById("panelBaslik").textContent=p.baslik||"";
  const ic=document.getElementById("panelIcerik");ic.innerHTML="";
  (p.icerik||"").split("\n").forEach(s=>{s=s.replace(/^-\s*/,"").trim();if(s){const d=document.createElement("div");d.textContent=s;ic.appendChild(d);}});
  el.classList.add("acik");
}
function muzikGoster(acik,ad){
  const el=document.getElementById("muzik");
  if(acik){document.getElementById("muzikAd").textContent=ad||"Müzik";el.classList.add("acik");}
  else el.classList.remove("acik");
}
function temaAyarla(t){document.body.classList.toggle("light",t==="light");}

// ---------- Sunucu ile senkron (poll) ----------
let sonPanel="",sonMuzik="";
function poll(){
  fetch("http://127.0.0.1:8137/").then(r=>r.json()).then(j=>{
    durumAyarla(j.d);
    const pj=JSON.stringify(j.panel||"");
    if(pj!==sonPanel){sonPanel=pj;panelGoster(j.panel);}
    const mj=(j.muzik?"1":"0")+(j.muzik_ad||"");
    if(mj!==sonMuzik){sonMuzik=mj;muzikGoster(j.muzik,j.muzik_ad);}
    temaAyarla(j.tema);
  }).catch(e=>{});
}
setInterval(poll,300);

// ---------- Sohbet kutusu ----------
function gonder(){
  const g=document.getElementById("giris"),m=g.value.trim();if(!m)return;g.value="";
  balonGoster(m);
  fetch("http://127.0.0.1:8137",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mesaj:m})}).catch(e=>{});
}
function balonGoster(m){
  const b=document.getElementById("balon");b.textContent=m;b.classList.add("gor");
  clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove("gor"),3000);
}
document.getElementById("gonder").onclick=gonder;
document.getElementById("giris").addEventListener("keydown",e=>{if(e.key==="Enter")gonder();});

// ---------- Acilis ----------
setTimeout(()=>{const a=document.getElementById("acilis");a.style.opacity=0;setTimeout(()=>a.style.display="none",1000);},2400);
</script>
</body>
</html>
